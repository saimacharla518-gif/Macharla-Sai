<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Video & Voice Generator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; background-color: #f4f7f6; }
        textarea { width: 100%; height: 100px; margin: 15px 0; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #2ea44f; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2c974b; }
        #outputArea { margin-top: 30px; display: none; }
        video { width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .loading { color: #666; font-style: italic; display: none; }
    </style>
</head>
<body>

    <h2>🎥 Free AI Video Generator</h2>
    <p>Enter your text prompt below to generate a video clip with a matching voiceover.</p>
    
    <textarea id="promptInput" placeholder="Example: A beautiful cinematic view of a sunset over the mountains..."></textarea>
    <br>
    <button onclick="generateVideo()">Generate Video</button>
    
    <p id="loadingStatus" class="loading">Processing prompt and compiling media assets... Please wait.</p>

    <div id="outputArea">
        <h3>Your Generated Output:</h3>
        <video id="videoResult" controls></video>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value.trim();
            const loading = document.getElementById('loadingStatus');
            const output = document.getElementById('outputArea');
            const videoElement = document.getElementById('videoResult');

            if (!prompt) {
                alert("Please enter a text script first!");
                return;
            }

            // Show loading indicators
            loading.style.display = 'block';
            output.style.display = 'none';

            try {
                // Utilizing the public open-source Pollinations backend (100% free, no API registration needed)
                // Encodes prompt parameters cleanly for video clip production
                const cleanQuery = encodeURIComponent(prompt);
                const freeVideoUrl = `https://pollinations.ai{cleanQuery}?width=1024&height=576&nologo=true&feed=true`;

                // Assign the public processing stream directly to the video window player
                videoElement.src = freeVideoUrl;
                
                // Present the UI to the user once loaded
                loading.style.display = 'none';
                output.style.display = 'block';
            } catch (error) {
                alert("An error occurred while compiling assets. Please try again.");
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
